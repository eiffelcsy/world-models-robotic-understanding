# Prompt-ablation gen config for grasp_region_seg: the 4 LIBERO tune frames, seed 0, this probe only.
# Run every arm with scripts/run_ablations.sh grasp_region_seg <arm> ... (docs/prompt_framework.md).
root: ../..
frames:
  type: frames_dir
  params:
    path: ./data/libero/frames
    pattern: '*.png'
    meta_file: ./data/libero/meta.yaml
    include: ./configs/libero_tune_ids.txt
semantics:
  type: cached
  params:
    overrides: configs/semantics_overrides.json
semantics_dir: semantics/libero
backend: omni12
arm: base
repeat: 0
seed_base: 0
clips_dir: clips/libero
output_dir: results/ablations/grasp_region_seg/gen
manifest_out: results/ablations/grasp_region_seg/manifest.yaml
modules_dir: modules
backends_dir: backends
modules:
  include:
  - grasp_region_seg
  exclude: []
video:
  duration_s: 6
limit: null
limit_by: null
limit_seed: 0
dry_run: false
refresh: false
fail_fast: false
