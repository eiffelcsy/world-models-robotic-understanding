name: instance_seg
description: >
  The objects relevant to this frame's task, masked one at a time in "an
  opaque colored mask", then held still. This base prompt does not ask for full
  saturation or a different color per object, though the decoder needs both:
  arms/E1.yaml tests asking for them. Everything else
  (the robot arm included) stays the untouched photograph. This is the asking
  half of the convention extractor.py decodes — change one and change the
  other, or the probe scores a model failure that is really a wiring failure.

enabled: true

prompt:
  type: template
  params:
    # Slots (docs/prompt_framework.md): P, C | T+E, T | R | H
    text: |
      This photograph stays exactly as it is: same framing, same lighting, same
      shadows, same photographic texture and grain. Nothing in it is redrawn,
      restyled, simplified, flattened or re-lit. The scene geometry also stays
      the same — no objects are added, removed or changed in any way.

      The camera is locked off on a tripod and does not move, pan, zoom or
      shake. Nothing in the scene moves.

      One at a time, in immediate succession, an opaque colored mask appears on
      top of each of these objects — {relevant_objects} — lying directly over
      that object and covering it exactly. Each mask spreads outward from
      inside the object until its edge sits precisely on that object's outline,
      then stops, including at thin parts, handles and holes. Once a mask has
      appeared, it stays unchanged for the rest of the clip.

      Everything not covered by a mask remains the untouched original
      photograph: every other object in the scene, the robot arm, the table
      surface, the floor, the walls, the background, and the shadows objects
      cast onto that surface.

      All masks are in place by {settle_s} seconds into the clip, after which the
      frame is completely still for the remainder of the {duration_s} seconds.
      Static locked-off camera, one continuous shot, no cut, no zoom, no pan,
      no dolly, no camera shake, no text, no labels, no outlines, no watermark.

    negative: >
      camera motion, panning, zooming, handheld shake, moving objects, shading,
      gradients, textures, highlights, outlines, edges, text, labels, captions,
      pale colors, pastel colors, white overlay, black overlay, grey overlay,
      transparency

    # Only {relevant_objects}. The instruction itself is deliberately NOT in the
    # prompt: this probe asks for masks on an object list that was already
    # decided upstream, and handing the model the task as well invites it to
    # act the task out or to reconcile the scene with it — which is exactly
    # wrong on a counterfactual or adversarial sample, where the instruction
    # names something that is not there. The instruction is still read, once, by
    # the `semantics:` stage that produces this list (its `instruction_key`);
    # it just never reaches the world model.
    #
    # `relevant_objects` comes from that stage, or straight from the source's
    # meta_file if the list was written by hand — a frame missing it fails here,
    # at render time, rather than reaching a backend with a hole in its prompt.
    requires: [relevant_objects]

# What to ask the backend for. The backend's own defaults fill anything omitted,
# and configs/gen.yaml overrides both — so a smoke run can shorten every clip
# without touching this file. {duration_s} above tracks whatever wins.
video:
  duration_s: 6
  aspect_ratio: "16:9"
  resolution: 720p

# Not a score — that is the eval pipeline's job, with ground truth. These only
# decide whether the file is worth putting in the manifest at all.
checks:
  - type: playable
    params:
      min_frames: 24        # a truncated clip is valid mp4 and useless
  - type: changed
    params:
      # Reported, not enforced: a model that ignored the prompt returns the
      # conditioning frame held still, and for this probe that does not score
      # zero — it scores whatever the scene's own saturated colors earn (see
      # "Calibrating the extractor" in README.md). Worth seeing in the summary.
      min_change: 0.0
