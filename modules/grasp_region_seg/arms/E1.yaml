# E1: what the answer looks like. Slot E.
#
# Word diff against T1:
#   • Then, [-a flat color covers-]{+an opaque colored mask appears on top of+} the
#   graspable part ... The [-flat color-]{+mask+} covers only that graspable region,
#   not the whole object, [-perfectly preserving-]{+and sits precisely on+} its
#   [-silhouette.-]{+outline. It is one flat, fully saturated color, with no
#   shading, gradient or texture.+}
#   • Everything not covered by the [-flat color-]{+mask+} remains ...
#
# Bridging path, adapted Wiedemer et al. (2025) segmentation prompt -> our base:
# paper -> R1 -> T1 -> E1 -> K1 -> base. Each arm is the previous one with one change.
# The base was written from the segmentation prompt by design; this path measures
# each change afterwards (docs/grasp_prompt_ablations.md).
#
# No negatives.
description: "E1: the base's opaque, saturated mask encoding"
prompt:
  params:
    text: |
      Create an animation of grasp region segmentation being performed on this photograph: the part of {grasp_object} that a robot would grasp is overlaid in a flat color.
      Scene:
      • The animation starts from the provided, unaltered photograph.
      • The scene in the photograph is static and doesn't move.
      • Then, an opaque colored mask appears on top of the graspable part of {grasp_object} — the region of the object that a robot gripper would close around to pick it up. The mask covers only that graspable region, not the whole object, and sits precisely on its outline. It is one flat, fully saturated color, with no shading, gradient or texture.
      • Everything not covered by the mask remains the untouched original photograph: the rest of the object, every other object in the scene, the robot arm, the table surface, the floor and the background.
      Camera:
      • Static shot without camera movement.
      • No pan.
      • No rotation.
      • No zoom.
      • No glitches or artifacts.
    negative: ""
