# T3: which part is graspable. Slot T.
#
# The demonstrated grasps are on thin parts: the finger gap at the grasp is 5-15 mm
# for bowls, mugs and bottles (data/libero/meta.yaml, grasp_width), i.e. a rim or
# neck, so the object's middle is the wrong answer. Names typical graspable parts
# generically, by object type, not per frame.
#
# Word diff against base:
#   ...close around to pick it up. {+This is usually a thin part the fingers can
#   pinch: a section of the rim of a bowl or mug, the neck of a bottle, or the
#   upper sides of a box or carton.+} The mask covers only ...
#
# Improvement arm, built from the base prompt (prompt.yaml), one slot changed.
# A hypothesis to run alongside the base (docs/grasp_prompt_ablations.md).
description: "T3: base plus where graspable parts usually are"
prompt:
  params:
    text: |
      This photograph stays exactly as it is: same framing, same lighting, same
      shadows, same photographic texture and grain. Nothing in it is redrawn,
      restyled, simplified, flattened or re-lit. The scene geometry also stays
      the same — no objects are added, removed or changed in any way.

      The camera is locked off on a tripod and does not move, pan, zoom or
      shake. Nothing in the scene moves.

      An opaque colored mask appears on top of the graspable part of
      {grasp_object} — the region of the object that a robot gripper would
      close around to pick it up.
      This is usually a thin part the fingers can pinch: a section of the rim of a
      bowl or mug, the neck of a bottle, or the upper sides of a box or carton. The mask covers only that graspable region,
      not the whole object, and sits precisely on its outline. It is one flat,
      fully saturated color, with no shading, gradient or texture. Once it has
      appeared it stays unchanged for the rest of the clip.

      Everything not covered by the mask remains the untouched original
      photograph: the rest of the object, every other object in the scene, the
      robot arm, the table surface, the floor and the background.

      The mask is in place by {settle_s} seconds into the clip, after which the
      frame is completely still for the remainder of the {duration_s} seconds.
      Static locked-off camera, one continuous shot, no cut, no zoom, no pan,
      no dolly, no camera shake, no text, no labels, no outlines, no watermark.
