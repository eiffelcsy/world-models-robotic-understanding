# E5: depth as light falling off from a lamp at the camera. Slot E.
#
# The paper's prompting advice (Sec. C, "Realism"): restate an abstract task as a
# realistic scene. Replaces the brightness paragraph; keeps its last sentence.
#
# Word diff against base (brightness paragraph):
#   [-Depth is shown only as brightness and nothing else. Surfaces closest to the
#   camera are the brightest — near white. Surfaces further away are darker,
#   grading smoothly to black at the far end of the scene.-] {+The room goes dark
#   and a single bright lamp at the camera lights the scene. Every surface turns
#   matte grey, and the light fades with distance: surfaces closest to the camera
#   are near white, and the light falls off smoothly to black at the far end of
#   the scene.+} A surface at one distance is one flat shade everywhere it appears.
#
# Improvement arm, built from the base prompt (prompt.yaml), one slot changed.
# A hypothesis to run after the base is diagnosed (docs/depth_prompt_ablations.md).
description: base with the brightness paragraph as lamp light falling off with distance
prompt:
  params:
    text: |
      This photograph becomes a single grayscale depth map of exactly the same
      scene, from exactly the same camera position: same framing, same field of
      view, same geometry. Every surface keeps its shape and outline. Nothing is
      added or removed.

      The room goes dark and a single bright lamp at the camera lights the scene.
      Every surface turns matte grey, and the light fades with distance: surfaces
      closest to the camera are near white, and the light falls off smoothly to
      black at the far end of the scene. A surface at one distance is one flat
      shade everywhere it appears.

      The image is completely grayscale. There is no color anywhere, no red or
      green or blue tint, no colormap, no rainbow, no red-to-blue scale. There
      are no edges, no outlines, no text, no labels, no numbers, no arrows, no
      shading detail, no texture, no highlights, no reflections: only smooth
      brightness that encodes distance.

      The camera is locked off on a tripod and does not move, pan, zoom or
      shake. The depth map is fully formed by {settle_s} seconds and then holds
      completely still for the rest of the {duration_s} seconds. One continuous
      shot, no cut.
