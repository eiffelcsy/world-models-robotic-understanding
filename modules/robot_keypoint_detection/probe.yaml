name: robot_keypoint_detection
description: >
  A small colored dot on each robot joint. Ground truth is the Panda links' exact
  image positions from a simulator replay of the demonstration (LIBERO only); the
  model never sees it.

enabled: true

level: Robot State
headline: pck

# Dots are small, so the preservation region is dilated generously before it is
# treated as "changed"; compliance needs at least one dot to decode.
gates:
  - {type: scene_preservation, params: {max_change: 0.15, dilate: 25}}
  - {type: instruction_compliance, params: {min_points: 1}}
  - {type: temporal_stability, params: {window_s: 1.0, stride: 2, max_diff: 10.0}}

readout:
  type: last_frame
  params:
    back_off: 1

best_frame:
  enabled: true
  rank_by: pck
  stride: 1
  start_index: 5

ground_truth:
  # Reads `sim_file` from the sample's meta (scripts/libero_replay/render_gt.py).
  type: sim_keypoints
  params: {}

extractor:
  type: color_points
  params:
    palette: null
    hue_tolerance: 22.0
    min_saturation: 0.5
    min_value: 0.2
    cleanup: 3
    min_area: 8
    max_area: 20000
    min_change: 40.0        # dot pixels must differ from the input frame (as grasp's
                            # color_mask); added 2026-11-11, saturated scene objects decoded as dots
    max_points: 32

metrics:
  - type: keypoint_pck
    params:
      threshold_frac: 0.05
