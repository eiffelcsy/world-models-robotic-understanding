# E1: what the answer looks like. Slot E.
#
# Word diff against T1:
#   [-Add a bright red dot and a bright green dot-]{+Two small, bright, fully
#   saturated circular dots appear+} on the robot arm, marking the orientation of
#   its gripper. ... ahead of the red dot. {+Both dots are small compact circles a
#   few pixels across — no lines, no arrows, no rings, no labels, no text.+} They
#   are the only thing that changes: ...
#
# Bridging path, Wiedemer et al. (2025) Fig. 12 adapted to pose -> our base:
# paper -> R1 -> T1 -> E1 -> K1 -> base. Each arm is the previous one with one change.
# The base was written by design; this path measures each change afterwards
# (docs/pose_prompt_ablations.md).
#
# No negatives.
description: "E1: the base's dot encoding (small, saturated, circular)"
prompt:
  params:
    text: |
      Two small, bright, fully saturated circular dots appear on the robot arm, marking the orientation of its gripper. The first dot is red. It sits exactly on the center of the gripper, right at the point the gripper would close on an object. The second dot is green. It sits just beyond the tips of the two gripper fingers, about a finger's length past them, on the straight line that runs from the back of the gripper through the middle of the fingertips. Both dots are small compact circles a few pixels across — no lines, no arrows, no rings, no labels, no text. They are the only thing that changes: the robot arm, every object in the scene, the table, the floor and the background all remain the untouched original photograph. Static camera perspective, no zoom or pan.
    negative: ""
